name: steam_bun_timer
description: "蒸馒头计时器 — 妈妈的厨房帮手"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 本地存储
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # 后台计时 & 通知
  flutter_foreground_task: ^8.10.0
  flutter_local_notifications: ^18.0.1

  # 屏幕常亮
  wakelock_plus: ^1.2.8

  # 音频播放 — 川话播报
  audioplayers: ^6.1.0

  # 权限请求
  permission_handler: ^11.3.1

  # 网络请求 — 天气 API
  http: ^1.2.2

  # 定位 — 天气 API
  geolocator: ^13.0.2

  # 振动 — 识别失败提示
  vibration: ^2.0.1

  # 工具
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^2.6.3
  build_runner: ^2.4.14
  drift_dev: ^2.21.0
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
