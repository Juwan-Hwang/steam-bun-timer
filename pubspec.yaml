name: steam_bun_timer
description: "蒸馒头计时器 — 厨房多批次并行计时助手"
publish_to: 'none'
version: 1.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 本地存储
  drift: ^2.21.0
  sqlite3_flutter_libs: ^0.5.28
  shared_preferences: ^2.3.4
  path_provider: ^2.1.5
  path: ^1.9.0

  # 屏幕常亮
  wakelock_plus: ^1.2.8

  # 音频播放 — 川话分段录音 + 铃声
  audioplayers: ^6.1.0

  # 语音合成 — 川话播报 TTS 降级
  flutter_tts: ^4.2.0

  # 权限请求
  permission_handler: ^11.3.1

  # 网络请求 — 天气 API
  http: ^1.2.2

  # 定位 — 天气 API
  geolocator: ^13.0.2

  # 振动 — 识别失败提示
  vibration: ^2.0.1

  # sherpa-onnx 本地语音识别
  sherpa_onnx: ^1.10.38

  # 工具
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.21.0
  build_runner: ^2.4.14

flutter:
  uses-material-design: true

  assets:
    - assets/audio/
    - assets/models/kws/
